# Dependabot version updates are disabled on purpose.
#
# This repository is an inactive fork of PostHog. Nothing is deployed or
# released from here, so dependency bumps opened against it are never merged;
# dependency updates are taken from upstream.
#
# `open-pull-requests-limit: 0` is the documented way to stop version-update
# PRs. An earlier `updates: []` did not stop the runs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
